const { useState, useEffect, useRef, createContext, useContext } = React;

/* ═══════════ ROUTER ═══════════ */
const RouterContext = createContext(null);

function RouterProvider({ children }) {
  const [route, setRoute] = useState('home');

  useEffect(() => { window.scrollTo(0, 0); }, [route]);

  useEffect(() => {
    const onPop = (e) => {
      if (e.state && e.state.route) setRoute(e.state.route);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const navigate = (r) => {
    setRoute(r);
    try { window.history.pushState({ route: r }, '', '#' + r); } catch(e) {}
  };

  return (
    <RouterContext.Provider value={{ route, navigate }}>
      {children}
    </RouterContext.Provider>
  );
}

const useRouter = () => useContext(RouterContext);

/* ═══════════ REVEAL HOOK ═══════════ */
function useReveal() {
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('show');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
}

}

function App() {

<script>
window.addEventListener('error', (e) => {
  const root = document.getElementById('root');
  if (root && !root.innerHTML.trim()) {
    root.innerHTML = `
      <div style="padding:40px;font-family:system-ui;max-width:600px;margin:60px auto;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:16px;">
        <h2 style="color:#991B1B;margin:0 0 12px;">⚠️ Something went wrong</h2>
        <p style="color:#7F1D1D;margin:0 0 16px;font-size:14px;">Error: ${e.message || 'Unknown'}</p>
        <p style="color:#7F1D1D;margin:0;font-size:13px;">Try opening the browser console (F12) for details.</p>
      </div>
    `;
  }
});
</script>
